spring.application.name=vetvision

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetvision?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
app.bootstrap.organization.email=${BOOTSTRAP_ORG_EMAIL:}
app.bootstrap.organization.password=${BOOTSTRAP_ORG_PASSWORD:}
app.bootstrap.organization.first-name=${BOOTSTRAP_ORG_FIRST_NAME:Organization}
app.bootstrap.organization.last-name=${BOOTSTRAP_ORG_LAST_NAME:Admin}

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.springframework.security=INFO
